<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Base64 Encoder und Decoder – DevTools."
    >

    <title>Base64 Encoder – DevTools</title>


    <script>

        const savedTheme =
            localStorage.getItem(
                "devtools-theme"
            );


        if (savedTheme === "light") {

            document.documentElement
                .classList.add(
                    "light-theme"
                );

        }

    </script>


    <link
        rel="stylesheet"
        href="../../shared/tool.css"
    >

</head>


<body>

<div class="tool-app">


    <header class="tool-header">

        <button
            class="tool-back"
            id="tool-back"
            type="button"
            aria-label="Zurück"
        >
            ←
        </button>


        <div class="tool-icon">
            64
        </div>


        <div class="tool-header-info">

            <h1>
                Base64 Encoder
            </h1>

            <p>
                Text codieren und decodieren
            </p>

        </div>


        <button
            class="tool-theme"
            id="tool-theme"
            type="button"
            aria-label="Theme wechseln"
        >
            ☀️
        </button>

    </header>


    <main class="tool-main">


        <!-- EINGABE -->

        <section class="tool-panel">

            <div class="tool-panel-header">

                <div>

                    <h2 class="tool-panel-title">
                        Eingabe
                    </h2>

                    <p class="tool-panel-description">
                        Text oder Base64-Daten eingeben.
                    </p>

                </div>

            </div>


            <textarea
                id="input"
                class="tool-textarea"
                placeholder="Hier Text oder Base64 eingeben..."
                spellcheck="false"
            ></textarea>


            <div class="tool-actions">

                <button
                    id="encode"
                    class="tool-button primary"
                    type="button"
                >
                    Encode
                </button>


                <button
                    id="decode"
                    class="tool-button"
                    type="button"
                >
                    Decode
                </button>


                <button
                    id="example"
                    class="tool-button"
                    type="button"
                >
                    Beispiel
                </button>


                <button
                    id="clear"
                    class="tool-button"
                    type="button"
                >
                    Leeren
                </button>

            </div>


            <div
                id="status"
                class="tool-status"
                role="status"
                aria-live="polite"
            ></div>

        </section>


        <!-- AUSGABE -->

        <section class="tool-panel">

            <div class="tool-panel-header">

                <div>

                    <h2 class="tool-panel-title">
                        Ausgabe
                    </h2>

                    <p class="tool-panel-description">
                        Das Ergebnis deiner Verarbeitung.
                    </p>

                </div>

            </div>


            <textarea
                id="output"
                class="tool-textarea"
                readonly
                spellcheck="false"
                placeholder="Das Ergebnis erscheint hier..."
            ></textarea>


            <div class="tool-actions">

                <button
                    class="tool-button"
                    type="button"
                    data-copy-target="output"
                >
                    Kopieren
                </button>

            </div>

        </section>


    </main>

</div>


<script src="../../shared/tool.js"></script>
<script src="base64.js"></script>

</body>

</html>
