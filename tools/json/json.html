<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="JSON Formatter – JSON formatieren, validieren und minimieren."
    >

    <title>JSON Formatter – DevTools</title>


    <!--
        Theme wird VOR dem CSS gesetzt.
        Dadurch gibt es beim Laden keinen
        kurzen Wechsel zwischen Dark und Light Mode.
    -->

    <script>

        const savedTheme =
            localStorage.getItem(
                "devtools-theme"
            );


        if (savedTheme === "light") {

            document.documentElement
                .classList.add(
                    "light-theme"
                );

        }

    </script>


    <!-- Gemeinsames Tool-CSS -->

    <link
        rel="stylesheet"
        href="../../shared/tool.css"
    >

</head>


<body>

<div class="tool-app">


    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="tool-header">


        <button
            class="tool-back"
            id="tool-back"
            type="button"
            aria-label="Zurück zur Startseite"
        >
            ←
        </button>


        <div class="tool-icon">
            {}
        </div>


        <div class="tool-header-info">

            <h1>
                JSON Formatter
            </h1>

            <p>
                JSON formatieren, validieren und minimieren
            </p>

        </div>


        <button
            class="tool-theme"
            id="tool-theme"
            type="button"
            aria-label="Theme wechseln"
        >
            ☀️
        </button>


    </header>


    <!-- ========================================
         MAIN
    ========================================= -->

    <main class="tool-main">


        <!-- ====================================
             JSON EINGABE
        ===================================== -->

        <section class="tool-panel">


            <div class="tool-panel-header">

                <div>

                    <h2 class="tool-panel-title">
                        JSON Eingabe
                    </h2>

                    <p class="tool-panel-description">
                        Füge hier dein JSON ein.
                    </p>

                </div>

            </div>


            <textarea
                id="json-input"
                class="tool-textarea"
                placeholder='{"name":"Max","age":24}'
                spellcheck="false"
            ></textarea>


            <div class="tool-actions">


                <button
                    id="format-json"
                    class="tool-button primary"
                    type="button"
                >
                    Formatieren
                </button>


                <button
                    id="minify-json"
                    class="tool-button"
                    type="button"
                >
                    Minimieren
                </button>


                <button
                    id="validate-json"
                    class="tool-button"
                    type="button"
                >
                    Validieren
                </button>


                <button
                    id="example-json"
                    class="tool-button"
                    type="button"
                >
                    Beispiel
                </button>


                <button
                    id="clear-json"
                    class="tool-button"
                    type="button"
                >
                    Leeren
                </button>


            </div>


            <div
                id="status"
                class="tool-status"
                role="status"
                aria-live="polite"
            ></div>


        </section>


        <!-- ====================================
             AUSGABE
        ===================================== -->

        <section class="tool-panel">


            <div class="tool-panel-header">

                <div>

                    <h2 class="tool-panel-title">
                        Ausgabe
                    </h2>

                    <p class="tool-panel-description">
                        Das verarbeitete JSON erscheint hier.
                    </p>

                </div>

            </div>


            <textarea
                id="json-output"
                class="tool-textarea"
                readonly
                spellcheck="false"
                placeholder="Das Ergebnis erscheint hier..."
            ></textarea>


            <div class="tool-actions">


                <button
                    class="tool-button"
                    type="button"
                    data-copy-target="json-output"
                >
                    Kopieren
                </button>


            </div>


        </section>


    </main>


</div>


<!-- Gemeinsames JavaScript -->

<script src="../../shared/tool.js"></script>

<!-- JSON-spezifisches JavaScript -->

<script src="json.js"></script>


</body>

</html>
